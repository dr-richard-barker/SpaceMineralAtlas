name: pipeline

# Two independent concerns, deliberately not coupled:
#
#   * `test` verifies the code and the committed results. It needs no network,
#     so it is the gate for deployment.
#   * `pipeline` re-runs the analysis against the live NASA APIs. It is a
#     freshness check, not a correctness gate, because those endpoints are
#     outside our control -- nlsp.nasa.gov serves an HTML interstitial with
#     HTTP 200 to GitHub's runner IP ranges while answering normally from a
#     residential connection. Blocking a deployment on someone else's WAF
#     would make the site undeployable for reasons unrelated to the work.
#
# The predecessor project's CI only deployed a static site and never ran the
# analysis at all; the point here is to run it, while being honest that a
# third-party API is not a build dependency we can guarantee.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly freshness check against the live APIs.
    - cron: '17 6 * * 1'

jobs:
  test:
    name: Tests and guards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Unit tests, synthetic-data guards, results regression
        # Runs offline against the committed results, so it verifies that the
        # published numbers are the ones the code produces.
        run: pytest tests/ -v

      - name: Verify every manuscript macro resolves
        run: python scripts_check_macros.py

  pipeline:
    name: Live NASA API freshness check
    runs-on: ubuntu-latest
    # Informational: a NASA endpoint blocking CI must not fail the build.
    continue-on-error: true
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # OSDR first: it is the source for every result in the manuscript, so if
      # only one of the two APIs is reachable this is the one worth knowing about.
      - name: Download OSDR data, harmonise units, run QC gates
        run: python scripts_curate.py

      - name: Analyse
        run: |
          python scripts_analyse_plants.py
          python scripts_analyse_astronauts.py
          python scripts_analyse_supply.py
          python scripts_integrate.py
          python scripts_ml.py

      - name: Confirm live results still match the published ones
        run: pytest tests/test_results_regression.py -v

      - name: Harvest LSDA catalog
        # Frequently blocked from CI IP ranges; see the note at the top. When
        # this is skipped the committed catalog under catalog/ is used, which is
        # real harvested data, not a substitute.
        id: lsda
        continue-on-error: true
        run: python scripts_harvest_lsda.py

      - name: Report LSDA harvest outcome
        run: |
          if [ "${{ steps.lsda.outcome }}" = "success" ]; then
            echo "LSDA catalog refreshed from the live endpoint."
          else
            echo "::warning::LSDA endpoint did not return JSON to this runner."
            echo "Downstream steps use the committed catalog in catalog/."
          fi

      - name: Verify every DOI still resolves
        run: python scripts_build_bibliography.py

      - name: Figures, numbers, FAIR package, dashboard
        run: |
          python scripts_figures.py
          python scripts_generate_numbers.py
          python scripts_check_macros.py
          python scripts_fair_package.py
          python scripts_build_docs.py

      - name: Show what changed against the committed outputs
        run: git --no-pager diff --stat -- analysis/ catalog/ data/processed/ docs/ || true

      - uses: actions/upload-artifact@v4
        with:
          name: analysis-outputs
          path: |
            analysis/results/
            analysis/figures/
            catalog/
            data/processed/
            fair/

  pages:
    name: Deploy dashboard
    needs: [test]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
